# Koyeb 部署声明配置（通用实时共享后端）
# 用法（有 Koyeb CLI 时）：
#   koyeb app init jpyida-shared-server --yaml koyeb.yaml --git github.com/zhu-1990/jpyida-shared-server --git-branch main
# 或在 Koyeb 控制台「Create App」→ 选 GitHub 仓库 → 构建方式选 Dockerfile，再按本文件核对端口/环境变量/卷。
name: jpyida-shared-server
services:
  - name: shared-server
    type: web
    # 应用监听的容器端口（server.js 读 process.env.PORT，Koyeb 会注入 PORT=3000）
    ports:
      - port: 3000
        protocol: http
    # 环境变量
    env:
      - key: PORT
        value: "3000"
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
    # 持久化卷：看板数据落盘到 /data（房间文档 <room>.json）
    # 注意：koyeb.yaml 中的卷若同名不存在，Koyeb 会自动创建；大小单位 GB
    volumes:
      - name: data
        path: /data
        size: 1
    # 健康检查（server.js 已提供 GET /health -> 200 ok）
    health_checks:
      - type: http
        port: 3000
        path: /health
        interval: 30
        timeout: 10
        healthy_threshold: 2
        unhealthy_threshold: 3
    # 免费层：nano = 0.1 vCPU / 512MB，单实例常驻
    scaling:
      min: 1
      max: 1
    instance_type: nano
    # 免费层可选区域：fra(法兰克福) / was(华盛顿)。日本/中国团队可选 was 略近。
    regions:
      - fra
